name: Build USBFast17

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg ldid

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'
          theos-sdks-branch: 'master'

      - name: Verify tools
        run: |
          export THEOS="${{ github.workspace }}/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "Checking ldid..."
          which ldid
          ldid -h || true

          echo "Checking Theos..."
          test -f "$THEOS/bin/nic.pl"
          test -f "$THEOS/bin/dm.pl"

          echo "Checking SDK..."
          ls -la "$THEOS/sdks"

          echo "Theos and SDK OK"

      - name: Clean build
        run: |
          export THEOS="${{ github.workspace }}/theos"
          export PATH="$THEOS/bin:$PATH"

          make clean || true

      - name: Build package
        run: |
          export THEOS="${{ github.workspace }}/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "THEOS=$THEOS"
          echo "SDKs:"
          ls -la "$THEOS/sdks"

          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: List packages
        if: always()
        run: |
          echo "Package files:"
          find packages -type f -maxdepth 2 -print 2>/dev/null || true

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: USBFast17-deb
          path: packages/*.deb
          if-no-files-found: error
