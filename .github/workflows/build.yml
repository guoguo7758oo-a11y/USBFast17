name: Build USBFast17

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -e

          git clone --recursive --depth=1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          # Make Theos tools available
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          # Make dm.pl available
          chmod +x "$THEOS/vendor/dm.pl/dm.pl"
          echo "$THEOS/vendor/dm.pl" >> "$GITHUB_PATH"

          echo "Checking dm.pl..."
          "$THEOS/vendor/dm.pl/dm.pl" --help

      - name: Build package
        shell: bash
        run: |
          set -e

          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "THEOS=$THEOS"
          echo "Checking dm.pl..."
          "$THEOS/vendor/dm.pl/dm.pl" --help

          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: USBFast17-deb
          path: packages/*.deb
