name: Build USBFast17

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

              - name: Install Theos
          run: |
            git clone --depth=1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
            echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
            echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"
            chmod +x "$GITHUB_WORKSPACE/theos/bin/dm.pl"

      - name: Build package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: USBFast17-deb
          path: packages/*.deb
