name: Build USBFast17

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg ldid

      - name: Install Theos
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Verify tools
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"

          echo "Checking ldid..."
          which ldid
          ldid -h || true

          echo "Checking Theos..."
          test -f "$THEOS/bin/dm.pl"

          echo "Theos and ldid OK"

      - name: Create package control
        run: |
          mkdir -p layout/DEBIAN

          cat > layout/DEBIAN/control <<'EOF'
          Package: com.usbfast17
          Name: USBFast17
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: USBFast17
          Maintainer: USBFast17
          Author: USBFast17
          Section: Tweaks
          EOF

          echo "Created package control:"
          cat layout/DEBIAN/control

      - name: Build package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "THEOS=$THEOS"
          echo "ldid=$(which ldid)"

          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: List packages
        if: always()
        run: |
          echo "Package files:"
          find packages -type f -maxdepth 2 -print 2>/dev/null || true

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: USBFast17-deb
          path: packages/*.deb
